# Preview of the hackathon site on GitHub Pages:
#   https://tucanocode04.github.io/qubito-hackathon-site/
# Runs on every push to main that touches hackathon/, or by hand (Actions tab > Run workflow).
# The real site is still built with `npm run build` and uploaded to the PoliTo server over SFTP.
# One-time setup: repo Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Deploy hackathon preview to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['hackathon/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hackathon
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hackathon/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://tucanocode04.github.io
          BASE_PATH: /qubito-hackathon-site
          NOINDEX: 'true'
          ASTRO_TELEMETRY_DISABLED: '1'
      - uses: actions/upload-pages-artifact@v5
        with:
          path: hackathon/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
